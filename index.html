<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h1>Color Palette Generator</h1>
      <button id="Generator-ptn">
        <i class="fas fa-sync-alt"></i> Generator Palette
      </button>
      <div class="palette-container">
        <!--color box 1 -->

        <div class="color-box">
          <div class="color" style="background-color: #2196f3"></div>
          <div class="color-info">
            <span class="hex-value">#2196f3</span>
            <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
          </div>
        </div>
        <!--color box 2 -->

        <div class="color-box">
          <div class="color" style="background-color: #ffeb3b"></div>
          <div class="color-info">
            <span class="hex-value">#ffeb3b</span>
            <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
          </div>
        </div>
        <!--color box 3 -->
        <div class="color-box">
          <div class="color" style="background-color: #ff9800"></div>
          <div class="color-info">
            <span class="hex-value">#ff9800</span>
            <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
          </div>
        </div>

        <!--color box 4 -->
        <div class="color-box">
          <div class="color" style="background-color: #e91e63"></div>
          <div class="color-info">
            <span class="hex-value">#e91e63</span>
            <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
          </div>
        </div>
        <!--color box 5 -->
        <div class="color-box">
          <div class="color" style="background-color: #607d8b"></div>
          <div class="color-info">
            <span class="hex-value">#607d8b</span>
            <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
          </div>
        </div>
        <!--color box 6 -->
        <div class="color-box">
          <div class="color" style="background-color: #795548"></div>
          <div class="color-info">
            <span class="hex-value">#795548</span>
            <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
